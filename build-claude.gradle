plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.claude.adblock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.claude.adblock'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest-claude.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }
}
